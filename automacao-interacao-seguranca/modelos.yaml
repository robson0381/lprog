# Modelos de preenchimento do "Registro de Interação" (SAP Fiori).
#
# As chaves de "campos" são os RÓTULOS exatos dos campos na tela (sem "*" e ":").
# Para combos, o valor deve ser o texto de uma das opções; rode
#   python preencher_interacao.py --listar-opcoes
# para ver as opções existentes (ex.: a lista de "Grandes Riscos").
# O marcador {hoje} é trocado pela data atual (dd/mm/aaaa).

# Como escolher o modelo em cada execução: rotativo (um após o outro) ou aleatorio
selecao: rotativo

# Campos aplicados em TODOS os envios. O app só traz o Responsável preenchido;
# os demais campos obrigatórios precisam estar aqui (ou no modelo).
campos_fixos:
  # A ordem importa: Área e Local da Instalação só liberam depois de Unidade e Empresa.
  Tipo de Interação: Interação de Segurança - Empregado
  Método Coach? (Interação Comportamental): Não
  Data: "{hoje}"
  A Interação foi realizada em qual unidade?: AMT-ArcelorMittal Tubarão
  Empresa: ARCELORMITTAL TUBARAO
  Área: ICEP - ICEP - GER AREA PROD DISTRIB ENERGIA ( 66013632 )
  Local da Instalação: Utilidades (AMT15)
  Houve Desvio?: Não
  Evento: ROTINA
  Houve Violação?: Não Houve Violação
  A Interação foi realizada em qual instante?: Nenhum instante específico

modelos:
  - nome: orientacao-padrao
    campos:
      Descrição: >-
        Realizada interação com a equipe orientando sobre a importância de seguir os
        padrões e procedimentos de segurança na execução das atividades.
      Ação Imediata: >-
        Reforçada a orientação para cumprimento dos padrões operacionais e de segurança
        e para relatar qualquer desvio identificado.
      A interação foi feita baseada em algum dos Grandes Riscos?: NENHUM ITEM ESPECÍFICO

  - nome: uso-de-epis
    campos:
      Descrição: >-
        Realizada interação com a equipe sobre o uso correto e a conservação dos EPIs
        necessários para as atividades da área.
      Ação Imediata: >-
        Orientada a verificação das condições dos EPIs antes do início das atividades e
        a substituição imediata dos que estiverem danificados.
      A interação foi feita baseada em algum dos Grandes Riscos?: NENHUM ITEM ESPECÍFICO

  - nome: organizacao-e-limpeza
    campos:
      Descrição: >-
        Interação comportamental de rotina na área, observando organização, limpeza e
        condições gerais do local de trabalho.
      Ação Imediata: >-
        Parabenizada a equipe pelas boas práticas observadas e reforçada a importância
        de manter a área organizada e de relatar desvios.
      A interação foi feita baseada em algum dos Grandes Riscos?: NENHUM ITEM ESPECÍFICO
